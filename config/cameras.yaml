# Four-camera Kalibr calibration, 2026-11-19, for the recorded 640x480 RGB streams.
# Source relative to repository root:
#   ../recordings/calibration_results/all_cameras_intrinsics.yaml
# Kalibr pinhole-radtan -> plumb_bob: [k1, k2, p1, p2, 0.0] (k3 was not fitted).
# Preserve separate fx and fy; the recorded streams have unequal axis scaling.
# Recorded Image.header.frame_id values are empty. The frame names below match
# the nominal optical frames generated by astribot_sdk_ros2/astribot_scripts.
# These intrinsics do not estimate camera-to-robot or inter-camera extrinsics.
# A nonempty live image frame must match its configured frame_id.
cameras:
  head:
    image_topic: /sdk/astribot_camera/head_rgbd/color_image
    detections_topic: /sdk/astribot_camera/head_rgbd/tag_detections
    frame_id: astribot_viz_head_rgbd_optical
    image_width: 640
    image_height: 480
    camera_matrix: [
      375.4396720193694, 0.0, 320.9007999446031,
      0.0, 500.086143979, 244.2798996658744,
      0.0, 0.0, 1.0
    ]
    distortion_model: plumb_bob
    distortion_coefficients: [0.07299779270841418, -0.08335393007731949, 0.0007396001871881766, -1.9585822945486577e-05, 0.0]

  torso:
